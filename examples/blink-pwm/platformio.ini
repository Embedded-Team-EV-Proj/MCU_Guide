; Starter project for the MCU research.
; Build one board:   pio run -e esp32dev
; Upload:            pio run -e esp32dev -t upload
; Serial monitor:    pio device monitor -b 115200
; In VS Code you can pick the environment from the PlatformIO toolbar instead.

[env]
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -D PWM_PIN=25

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -D PWM_PIN=4 -D LED_PIN=5

[env:uno]
platform = atmelavr
board = uno
build_flags = -D PWM_PIN=9

[env:pico]
platform = raspberrypi
board = pico
build_flags = -D PWM_PIN=15
